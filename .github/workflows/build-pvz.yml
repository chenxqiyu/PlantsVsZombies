name: Build PlantsVsZombies APK (Direct Android Build)

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: ☕ Set up JDK 11 (recommended for modern Android builds)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '11'

      - name: 🤖 Set up Android SDK
        uses: android-actions/setup-android@v3
        # This action automatically sets ANDROID_HOME, PATH, and installs cmdline-tools

      - name: 📥 Install required SDK components
        run: |
          sdkmanager \
            "platforms;android-30" \
            "build-tools;30.0.3"

      - name: 🏗️ Build APK with Gradle
        run: |
          if [ -d ./proj.android ]; then
            cd proj.android
          elif [ -d ./android ]; then
            cd android
          else
            echo "❌ No Android project directory found!"
            ls -la
            exit 1
          fi

          chmod +x ./gradlew
          ./gradlew assembleDebug

      - name: 🔍 Locate APK
        id: find_apk
        run: |
          apk=$(find . -path "*/outputs/apk/*/*debug*.apk" -type f | head -n1)
          if [ -z "$apk" ]; then
            echo "❌ Debug APK not found!"
            find . -name "*.apk"
            exit 1
          fi
          echo "apk_path=$apk" >> "$GITHUB_OUTPUT"
          echo "Found APK: $apk"

      - name: ⬆️ Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: PlantsVsZombies-Debug-APK
          path: ${{ steps.find_apk.outputs.apk_path }}
          retention-days: 7

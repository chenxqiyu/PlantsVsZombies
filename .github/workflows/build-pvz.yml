name: Build PlantsVsZombies APK

on:
  push:
    branches: [ "master", "master" ]
  pull_request:
    branches: [ "master", "master" ]
  workflow_dispatch:

jobs:
  build:
    # 👇 显式指定 Ubuntu 20.04（关键！）
    runs-on: ubuntu-22.04

    env:
      JAVA_VERSION: '8'                    # Cocos2d-x 推荐 JDK 8
      ANDROID_NDK_VERSION: '21.4.7075529'  # NDK r21e

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: ☕ Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}

      - name: 🐍 Install Python 3 and pip
        run: |
          sudo apt update
          sudo apt install -y python3 python3-pip

      - name: 📦 Install CMake, unzip, wget
        run: sudo apt install -y cmake unzip wget

      - name: 🤖 Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: 📥 Install Android NDK r21e
        run: |
          echo "Installing NDK r21e..."
          sdkmanager "ndk;${ANDROID_NDK_VERSION}"
          echo "ANDROID_NDK_ROOT=${ANDROID_HOME}/ndk/${ANDROID_NDK_VERSION}" >> $GITHUB_ENV

      - name: 🔧 Set Cocos2d-x environment variables
        run: |
          echo "ANDROID_SDK_ROOT=${ANDROID_HOME}" >> $GITHUB_ENV
          echo "NDK_ROOT=${ANDROID_HOME}/ndk/${ANDROID_NDK_VERSION}" >> $GITHUB_ENV

      - name: 🏗️ Build APK using Cocos2d-x
        run: |
          # 尝试常见 cocos 脚本路径
          if [ -f ./cocos2d/cocos.py ]; then
            python3 ./cocos2d/cocos.py compile -p android --android-studio --app-abi arm64-v8a
          elif [ -f ./tools/cocos2d-console/bin/cocos ]; then
            ./tools/cocos2d-console/bin/cocos compile -p android --android-studio --app-abi arm64-v8a
          elif [ -d ./proj.android ]; then
            # 如果已预生成 Android 项目，直接用 Gradle（需确保 jni 已存在）
            cd proj.android
            chmod +x gradlew
            ./gradlew assembleDebug
          else
            echo "❌ No valid build entry found!"
            ls -la
            exit 1
          fi

      - name: 🔍 Find APK file
        id: find_apk
        run: |
          apk=$(find . -path "*/outputs/apk/*/*.apk" -type f | head -n1)
          if [ -z "$apk" ]; then
            echo "❌ APK not found!"
            find . -name "*.apk"  # debug
            exit 1
          fi
          echo "apk_path=$apk" >> $GITHUB_OUTPUT
          echo "Found APK: $apk"

      - name: ⬆️ Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PlantsVsZombies-Android
          path: ${{ steps.find_apk.outputs.apk_path }}
          retention-days: 7

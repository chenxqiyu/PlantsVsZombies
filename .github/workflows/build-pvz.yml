name: Build PlantsVsZombies APK

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    env:
      JAVA_VERSION: '8'
      # Use cmdline-tools v6.0 (last version compatible with JDK 8)
      CMDLINE_TOOLS_URL: https://dl.google.com/android/repository/commandlinetools-linux-6858069_latest.zip
      ANDROID_NDK_VERSION: '21.4.7075529'  # r21e

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: ☕ Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}

      - name: 🐍 Install dependencies
        run: |
          sudo apt update
          sudo apt install -y python3 python3-pip cmake unzip wget

      - name: 🤖 Install Android SDK (with cmdline-tools v6.0 for JDK 8)
        run: |
          ANDROID_HOME="$HOME/android-sdk"
          mkdir -p "$ANDROID_HOME/cmdline-tools"

          wget -q "${CMDLINE_TOOLS_URL}" -O cmdline-tools.zip
          unzip -q cmdline-tools.zip -d "$ANDROID_HOME/cmdline-tools"
          # Now we have: $ANDROID_HOME/cmdline-tools/cmdline-tools/
          # Rename inner folder to 'latest'
          mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"

          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"

      - name: 📝 Accept Android SDK licenses
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true

      - name: 📥 Install Android platform, build-tools, and NDK
        run: |
          sdkmanager \
            "platform-tools" \
            "platforms;android-30" \
            "build-tools;30.0.3" \
            "ndk;${ANDROID_NDK_VERSION}"

      - name: 🔧 Set environment variables for Cocos2d-x
        run: |
          NDK_ROOT="$ANDROID_HOME/ndk/${ANDROID_NDK_VERSION}"
          echo "NDK_ROOT=$NDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$NDK_ROOT" >> "$GITHUB_ENV"

      - name: 🏗️ Build APK with Gradle
        run: |
          if [ -d ./proj.android ]; then
            cd proj.android
          elif [ -d ./android ]; then
            cd android
          else
            echo "❌ No Android project directory found!"
            ls -la
            exit 1
          fi

          chmod +x ./gradlew
          ./gradlew assembleDebug

      - name: 🔍 Locate APK
        id: find_apk
        run: |
          apk=$(find . -path "*/outputs/apk/*/*debug*.apk" -type f | head -n1)
          if [ -z "$apk" ]; then
            echo "❌ Debug APK not found!"
            find . -name "*.apk"
            exit 1
          fi
          echo "apk_path=$apk" >> "$GITHUB_OUTPUT"
          echo "Found APK: $apk"

      - name: ⬆️ Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: PlantsVsZombies-Debug-APK
          path: ${{ steps.find_apk.outputs.apk_path }}
          retention-days: 7
